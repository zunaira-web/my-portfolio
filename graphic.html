<!DOCTYPE html>
<html>
<head>
<style>

body {
  display: flex;
  justify-content: center;  /* horizontal center */
  align-items: center;      /* vertical center */
  height: 100vh;            /* full screen height */
  margin: 0;
  background-color: rgb(22, 22, 75);
}

.img-container {
  display: grid;
  grid-template-columns: repeat(2, 150px);
  gap: 20px;
}

.img-container img {
  width: 150px;
  height: 150px;
  object-fit: cover;

  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);

  transition: 0.3s;
}

.img-container img:hover {
  transform: scale(1.1);
}

</style>
</head>

<body>
<div class="img-container">
  <img src="grph1.jpeg">
  <img src="grph2.jpeg">
  <img src="grph3.jpeg">
  <img src="grph4.jpeg">
</div>

</body>
</html>
