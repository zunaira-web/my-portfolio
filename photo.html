<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Editor</title>

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: rgb(22, 22, 75);
    font-family: sans-serif;
}

/* container */
.img-container {
    display: flex;
    gap: 40px;
}

/* each box */
.img-box {
    text-align: center;
}

/* heading */
.img-box h2 {
    color: azure;
    margin-bottom: 10px;
    font-size: 1.2rem;
}

/* image */
.img-box img {
    width: 300px;
    height: 220px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: 0.3s;
}

/* hover */
.img-box img:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px #bcb3f0;
}
</style>
</head>

<body>

<div class="img-container">

    <div class="img-box">
        <h2>BEFORE</h2>
        <img src="imm2.png.jpeg" alt="Before Image">
    </div>

    <div class="img-box">
        <h2>AFTER</h2>
        <img src="imm.png.jpeg" alt="After Image">
    </div>

</div>

</body>
</html>
